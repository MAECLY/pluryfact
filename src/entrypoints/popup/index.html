<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legajo</title>
  </head>
  <body>
    <header class="cabecera">
      <div class="marca">
        <img src="/icon/32.png" width="20" height="20" alt="" />
        <span>Legajo</span>
      </div>
      <span id="pantalla" class="pantalla"></span>
    </header>

    <nav class="pestanas" role="tablist" aria-label="Secciones">
      <button type="button" id="tab-form" class="pestana" role="tab" aria-selected="true" aria-controls="panel-form">Nueva descarga</button>
      <button type="button" id="tab-descargas" class="pestana" role="tab" aria-selected="false" aria-controls="panel-descargas">
        Descargas<i id="tab-indicador" class="indicador" hidden></i>
      </button>
    </nav>

    <main id="panel-form" class="panel" role="tabpanel" aria-labelledby="tab-form">
      <fieldset class="grupo">
        <legend>Qué</legend>
        <div id="tipos" class="opciones"></div>
      </fieldset>

      <fieldset class="grupo">
        <legend>Cuándo</legend>
        <div class="modos" role="group" aria-label="Tipo de periodo">
          <button type="button" data-periodo="mes" aria-pressed="true">Mes</button>
          <button type="button" data-periodo="anio" aria-pressed="false">Año</button>
          <button type="button" data-periodo="dia" aria-pressed="false">Día</button>
          <button type="button" data-periodo="rango" aria-pressed="false">Rango</button>
        </div>
        <div id="campos-periodo" class="campos"></div>
      </fieldset>

      <fieldset id="sec-emisor" class="grupo">
        <legend><label for="emisor">De quién</label></legend>
        <input id="emisor" class="campo" type="text" placeholder="Todos los emisores, o un RUC o nombre" autocomplete="off" />
      </fieldset>

      <fieldset class="grupo">
        <legend>Archivos</legend>
        <div class="casillas">
          <label><input id="f-xml" type="checkbox" checked />XML</label>
          <label><input id="f-pdf" type="checkbox" checked />RIDE en PDF</label>
          <label><input id="f-txt" type="checkbox" />Reporte del SRI</label>
        </div>
      </fieldset>

      <p id="plan" class="plan" aria-live="polite"></p>
    </main>

    <main id="panel-descargas" class="panel" role="tabpanel" aria-labelledby="tab-descargas" hidden>
      <p id="sin-descargas" class="vacio">Todavía no hay descargas. Elige qué bajar en «Nueva descarga».</p>

      <section id="progreso" class="progreso" hidden aria-live="polite">
        <h1 id="prog-titulo" class="titulo"></h1>
        <ol id="prog-pasos" class="fichero" aria-label="Avance por periodo"></ol>
        <p id="prog-mensaje" class="estado-frase"></p>
        <p id="prog-cifras" class="cifras"></p>
        <p id="prog-problema" class="problema" hidden></p>
        <details id="prog-detalle" class="detalle">
          <summary>Ver detalle</summary>
          <ol id="prog-actividad" class="actividad"></ol>
          <ul id="prog-fallidas" class="fallidas"></ul>
        </details>
      </section>
    </main>

    <footer class="pie">
      <p id="estado" class="aviso" hidden></p>
      <button id="descargar" type="button" class="boton boton-principal" disabled>Descargar</button>
      <button id="secundario" type="button" class="enlace" hidden>Nueva descarga</button>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
